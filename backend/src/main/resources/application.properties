# ArogyaGram Spring Boot Configuration
server.port=8080
spring.application.name=arogya-gram-backend

# Datasource Configuration (Default: H2 In-Memory for Rapid Testing)
spring.datasource.url=jdbc:h2:mem:arogyadb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate Properties
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT Security Secrets
app.jwt.secret=9a2f8c4e1b7d5e8f3a6c9d2b4e7f1a5c8d3e6b9a2f4c7d0e3f6a9b2c5d8e1f4
app.jwt.expiration-ms=86400000

# CORS Configuration
spring.web.cors.allowed-origins=http://localhost:3000,http://localhost:5173
